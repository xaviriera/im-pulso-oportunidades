<title>Expedientes — IM·PULSO</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid;
    place-items: center; padding: 24px 16px; background: #f3f4f2; color: #202b2a;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 420px; padding: clamp(24px, 6vw, 40px);
    background: #fff; border: 1px solid #d9dfdc; border-radius: 14px; }
  h1 { margin: 0 0 12px; font-size: 1.65rem; line-height: 1.25;
    letter-spacing: -.025em; overflow-wrap: anywhere; }
  p { margin: 0 0 28px; color: #58625e; font-size: .95rem; line-height: 1.6; }
  label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 600; }
  input, button { width: 100%; min-height: 48px; border-radius: 6px; font: inherit; }
  input { border: 1px solid #89958f; padding: 12px; background: #fff;
    color: #202b2a; caret-color: #244f42; }
  button { margin-top: 16px; padding: 12px 16px; border: 0; background: #244f42;
    color: #fff; font-weight: 600; cursor: pointer; }
  button:hover:not(:disabled) { background: #193b31; }
  button:disabled { background: #596b64; cursor: wait; }
  :focus-visible { outline: 3px solid #34735f; outline-offset: 3px; }
  ::selection { background: #d9ebe2; color: #202b2a; }
  #mensaje { min-height: 3em; margin: 16px 0 0; color: #9b2929;
    font-size: .875rem; line-height: 1.5; }
</style>
</head>
<body>
<main aria-labelledby="titulo">
  <h1 id="titulo">Expedientes — IM·PULSO</h1>
  <p>Introduce la contraseña para consultar el expediente.</p>
  <form id="acceso">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
      required autofocus aria-describedby="mensaje">
    <button type="submit">Abrir</button>
    <p id="mensaje" role="status" aria-live="polite" aria-atomic="true"></p>
  </form>
  <noscript>Activa JavaScript en el navegador para abrir el expediente.</noscript>
</main>

<script>
"use strict";
const datos = JSON.parse(document.getElementById("datos-cifrados").textContent);
const formulario = document.getElementById("acceso");
const campo = document.getElementById("password");
const boton = formulario.querySelector("button");
const mensaje = document.getElementById("mensaje");
const bytes = (base64) => Uint8Array.from(atob(base64), c => c.charCodeAt(0));

if (!globalThis.crypto || !globalThis.crypto.subtle) {
  mensaje.textContent = "Este navegador no permite el descifrado. Abre el archivo local en un navegador actualizado o utiliza HTTPS.";
  boton.disabled = true;
}

formulario.addEventListener("submit", async (evento) => {
  evento.preventDefault();
  if (boton.disabled || !campo.value) return;
  boton.disabled = true;
  boton.textContent = "Abriendo…";
  formulario.setAttribute("aria-busy", "true");
  mensaje.textContent = "";
  campo.removeAttribute("aria-invalid");
  let original;
  try {
    const material = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(campo.value), "PBKDF2", false, ["deriveKey"]
    );
    const clave = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: bytes(datos.salt), iterations: 200000 },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    const descifrado = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes(datos.iv), tagLength: 128 }, clave, bytes(datos.ciphertext)
    );
    original = new TextDecoder("utf-8", { fatal: true }).decode(descifrado);
  } catch {
    // El mismo error sirve para contraseña incorrecta o archivo manipulado.
    mensaje.textContent = "No se ha podido abrir. Contraseña incorrecta o archivo dañado. Inténtalo de nuevo.";
    campo.setAttribute("aria-invalid", "true");
    campo.value = "";
    boton.disabled = false;
    boton.textContent = "Abrir";
    formulario.removeAttribute("aria-busy");
    campo.focus();
    return;
  }
  campo.value = "";
  // Abrimos un documento limpio: conserva doctype, head, CSS y ejecución de
  // scripts del original. innerHTML no ejecutaría sus scripts incrustados.
  document.open();
  document.write(original);
  document.close();
});
</script>
