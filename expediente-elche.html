<script>
"use strict";
const datos = JSON.parse(document.getElementById("datos-cifrados").textContent);
const formulario = document.getElementById("acceso");
const campo = document.getElementById("password");
const boton = formulario.querySelector("button");
const mensaje = document.getElementById("mensaje");
const bytes = (base64) => Uint8Array.from(atob(base64), c => c.charCodeAt(0));

async function intentarDescifrado(password) {
  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
  );
  const clave = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: bytes(datos.salt), iterations: 200000 },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const descifrado = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytes(datos.iv), tagLength: 128 }, clave, bytes(datos.ciphertext)
  );
  return new TextDecoder("utf-8", { fatal: true }).decode(descifrado);
}

if (!globalThis.crypto || !globalThis.crypto.subtle) {
  mensaje.textContent = "Este navegador no permite el descifrado. Abre el archivo local en un navegador actualizado o utiliza HTTPS.";
  boton.disabled = true;
}

formulario.addEventListener("submit", async (evento) => {
  evento.preventDefault();
  if (boton.disabled || !campo.value) return;
  boton.disabled = true;
  boton.textContent = "Abriendo…";
  formulario.setAttribute("aria-busy", "true");
  mensaje.textContent = "";
  campo.removeAttribute("aria-invalid");
  let original;
  try {
    original = await intentarDescifrado(campo.value);
  } catch {
    // Reintento único: el teclado del móvil pudo autocapitalizar la primera letra.
    const variante = campo.value.charAt(0).toLowerCase() + campo.value.slice(1);
    if (variante !== campo.value) {
      try {
        original = await intentarDescifrado(variante);
      } catch {
        original = undefined;
      }
    }
  }
  if (original === undefined) {
    // El mismo error sirve para contraseña incorrecta o archivo manipulado.
    mensaje.textContent = "No se ha podido abrir. Si estás seguro de que la contraseña es correcta, recarga la página con Ctrl+F5 (o Cmd+Shift+R en Mac) por si el navegador tiene guardada una copia antigua. Si no, revisa la contraseña e inténtalo de nuevo.";
    campo.setAttribute("aria-invalid", "true");
    campo.value = "";
    boton.disabled = false;
    boton.textContent = "Abrir";
    formulario.removeAttribute("aria-busy");
    campo.focus();
    return;
  }
  campo.value = "";
  // Abrimos un documento limpio: conserva doctype, head, CSS y ejecución de
  // scripts del original. innerHTML no ejecutaría sus scripts incrustados.
  document.open();
  document.write(original);
  document.close();
});
</script>
